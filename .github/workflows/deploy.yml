name: BookScout CD

on:
  workflow_run:
    workflows: ["BookScout CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bookscout-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.BOOKSCOUT_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.BOOKSCOUT_KNOWN_HOSTS}}

        run: |

          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh


          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy BookScout to both servers

        env:
          WEB01_HOST: ${{ secrets.WEB01_HOST }}
          WEB02_HOST: ${{ secrets.WEB02_HOST }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

        run: |

          set -euo pipefail

          for HOST in "$WEB01_HOST" "$WEB02_HOST"; do
            echo "Deploying BookScout to $HOST"

            ssh \
              -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              ubuntu@"$HOST" bash -se -- "$DEPLOY_SHA" <<'REMOTE'

            set -euo pipefail

            cd /home/ubuntu/book-scout

            echo "Fetching application updates..."
            git fetch origin main
            git checkout main
            git merge --ff-only "$1"

            echo "Installing dependencies..."
            /home/ubuntu/.local/bin/uv pip install \
              --python .venv/bin/python \
              -r requirements.txt

            echo "Restarting BookScout..."
            sudo -n systemctl restart bookscout

            echo "Checking application health..."

            for attempt in $(seq 1 15); do
              if curl -fsS \
                --max-time 5 \
                http://127.0.0.1:8000/api/health; then

                echo "Application is healthy!"
                exit 0

              fi

              sleep 2

            done

            echo "Deployment health check failed"
            exit 1

          REMOTE

            echo "Deployment successful on $HOST"
          done

          echo "BookScout deployment completed successfully"
