name: BookScout Docker Publish

on:

  workflow_run:
    workflows: ["BookScout CI"]
    types: ["completed"]

jobs:
  publish:

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository


    runs-on: ubuntu-latest

    permissions:

      contents: read
      packages: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to github container registry
        uses: docker/login-action@v3

        with:

          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push BookScout CLi
        uses: docker/build-push-action@v6


        with:

          context: .
          file: ./Dockerfile.cli
          push: true
          tags: |
            ghcr.io/jlouange/bookscout-cli:latest
            ghcr.io/jlouange/bookscout-cli:sha-${{ github.event.workflow_run.head_sha }}

          labels: |
            org.opencontainers.image.source=https://github.com/jlouange/book-scout
